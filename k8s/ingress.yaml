apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codespace-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: "*.preview.localhost"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: router-service
                port:
                  number: 80
